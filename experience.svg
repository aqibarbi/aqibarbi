<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Experience timeline</title>
<desc id="d">Aug 2024 to Apr 2026: Frontend Developer Intern at FINEWEBS Ltd. Apr 2026 to Sep 2026: Frontend Developer at SkillWays, Bahawalpur. Sep 2026 to present: Web Design and Development Trainer at Enablers Bahawalpur (formerly SkillWays).</desc>
<style>
.sans{font-family:Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.date{fill:#7f93c2;font-size:19px;text-anchor:middle}
.role{fill:#e6ecff;font-size:28px;font-weight:700;text-anchor:middle}
.org{fill:#8a96b8;font-size:21px;text-anchor:middle}
/* current-role node pulses, dot travels along the line. all text stays visible without animation */
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(2.8);opacity:0}}
.travel{animation:travel 6s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(920px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}.travel{animation:none;opacity:0}}
</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
<linearGradient id="line" gradientUnits="userSpaceOnUse" x1="140" y1="0" x2="1060" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs>

<rect x=".75" y=".75" width="1198.5" height="298.5" rx="22" fill="#0b1020"/>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="22" fill="url(#dots)"/>

<!-- timeline line -->
<line x1="140" y1="100" x2="1060" y2="100" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-opacity=".7"/>
<circle class="travel" cx="140" cy="100" r="5" fill="#bfdbfe"/>

<!-- column 1: FINEWEBS -->
<circle cx="200" cy="100" r="9" fill="#3b82f6"/>
<text x="200" y="62" class="mono date">Aug 2024 to Apr 2026</text>
<text x="200" y="160" class="sans role">Frontend Developer</text>
<text x="200" y="194" class="sans role">Intern</text>
<text x="200" y="238" class="sans org">FINEWEBS Ltd.</text>

<!-- column 2: SkillWays -->
<circle cx="600" cy="100" r="9" fill="#3b82f6"/>
<text x="600" y="62" class="mono date">Apr 2026 to Sep 2026</text>
<text x="600" y="160" class="sans role">Frontend Developer</text>
<text x="600" y="204" class="sans org">SkillWays, Bahawalpur</text>

<!-- column 3: Enablers (current) -->
<circle class="pulse" cx="1000" cy="100" r="9" fill="none" stroke="#22d3ee" stroke-width="2"/>
<circle cx="1000" cy="100" r="9" fill="#22d3ee"/>
<text x="1000" y="62" class="mono date">Sep 2026 to present</text>
<text x="1000" y="160" class="sans role">Web Design &amp;</text>
<text x="1000" y="194" class="sans role">Development Trainer</text>
<text x="1000" y="238" class="sans org">Enablers Bahawalpur</text>
<text x="1000" y="266" class="sans org">(formerly SkillWays)</text>
</svg>
