<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How I work</title>
<desc id="d">Four steps. 1 Brief: tell me what you need and by when. 2 Quote: scope, timeline and price. 3 Build: updates while I build. 4 Revisions: fixes in agreed scope, extras are quoted.</desc>
<style>
.sans{font-family:Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.num{fill:#93c5fd;font-size:24px;font-weight:600;text-anchor:middle}
.title{fill:#e6ecff;font-size:32px;font-weight:700}
.sub{fill:#8a96b8;font-size:24px}
/* ring pulses on each step in order. all text stays visible without animation */
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:step 8s ease-out infinite}
@keyframes step{0%{transform:scale(1);opacity:.9}20%{transform:scale(2.2);opacity:0}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:0}}
</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
</defs>

<rect x=".75" y=".75" width="798.5" height="358.5" rx="22" fill="#0b1020"/>
<rect x=".75" y=".75" width="798.5" height="358.5" rx="22" fill="url(#dots)"/>

<!-- step 1 -->
<rect x="30" y="30" width="355" height="140" rx="16" fill="#0f1629" stroke="#22305a"/>
<circle class="ring" cx="72" cy="78" r="22" fill="none" stroke="#22d3ee" stroke-width="2" style="animation-delay:0s"/>
<circle cx="72" cy="78" r="22" fill="#1B4FBD" fill-opacity=".25" stroke="#3b82f6" stroke-opacity=".7"/>
<text x="72" y="86" class="mono num">1</text>
<text x="110" y="88" class="sans title">Brief</text>
<text x="58" y="128" class="sans sub">What you need,</text>
<text x="58" y="156" class="sans sub">and by when</text>

<!-- step 2 -->
<rect x="415" y="30" width="355" height="140" rx="16" fill="#0f1629" stroke="#22305a"/>
<circle class="ring" cx="457" cy="78" r="22" fill="none" stroke="#22d3ee" stroke-width="2" style="animation-delay:2s"/>
<circle cx="457" cy="78" r="22" fill="#1B4FBD" fill-opacity=".25" stroke="#3b82f6" stroke-opacity=".7"/>
<text x="457" y="86" class="mono num">2</text>
<text x="495" y="88" class="sans title">Quote</text>
<text x="443" y="128" class="sans sub">Scope, timeline</text>
<text x="443" y="156" class="sans sub">and price</text>

<!-- step 3 -->
<rect x="30" y="190" width="355" height="140" rx="16" fill="#0f1629" stroke="#22305a"/>
<circle class="ring" cx="72" cy="238" r="22" fill="none" stroke="#22d3ee" stroke-width="2" style="animation-delay:4s"/>
<circle cx="72" cy="238" r="22" fill="#1B4FBD" fill-opacity=".25" stroke="#3b82f6" stroke-opacity=".7"/>
<text x="72" y="246" class="mono num">3</text>
<text x="110" y="248" class="sans title">Build</text>
<text x="58" y="288" class="sans sub">Updates while</text>
<text x="58" y="316" class="sans sub">I build</text>

<!-- step 4 -->
<rect x="415" y="190" width="355" height="140" rx="16" fill="#0f1629" stroke="#22305a"/>
<circle class="ring" cx="457" cy="238" r="22" fill="none" stroke="#22d3ee" stroke-width="2" style="animation-delay:6s"/>
<circle cx="457" cy="238" r="22" fill="#1B4FBD" fill-opacity=".25" stroke="#3b82f6" stroke-opacity=".7"/>
<text x="457" y="246" class="mono num">4</text>
<text x="495" y="248" class="sans title">Revisions</text>
<text x="443" y="288" class="sans sub">Fixes in agreed scope</text>
<text x="443" y="316" class="sans sub">Extras are quoted</text>
</svg>
